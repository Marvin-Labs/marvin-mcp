[project]
name = "marvin-mcp"
version = "0.1.0"
description = "Ask Marvin from any MCP client, over the Marvin Labs public API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Below 3.15 until every dependency ships wheels for it: uvx runs the newest Python it finds, and
# without a wheel uv builds from source, which fails on machines with no compiler.
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastmcp>=3.4,<4",
    "httpx>=0.28,<1",
    "prompt-toolkit>=3.0.48,<4",
    "rich>=13,<16",
    "tomlkit>=0.13,<1",
]

[project.urls]
Repository = "https://github.com/Marvin-Labs/marvin-mcp"

[project.scripts]
marvin-mcp = "marvin_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "respx>=0.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marvin_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
# Rebuild a local checkout when the code changes, not only pyproject.toml, so
# `uvx --from <checkout>` never runs a stale build while testing.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
